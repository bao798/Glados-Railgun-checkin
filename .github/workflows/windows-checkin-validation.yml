name: Validate Windows checkin package
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'windows-checkin/**'
      - '.github/workflows/windows-checkin-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate JavaScript
        working-directory: windows-checkin
        run: |
          node --check main.js
          node --check browser-checkin.js
          node --test
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem windows-checkin/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed"
            }
          }
