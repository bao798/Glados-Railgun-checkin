name: University private automation

on:
  push:
    branches: [master]
    paths: ['automation/**', '.github/workflows/university-assistant.yml']
  schedule:
    # Asia/Shanghai: hourly 08:37 through 22:37. Daily digest at/after 21:37.
    - cron: '37 0-14 * * *'
    # Temporary native-scheduler verification; remove after first schedule event.
  workflow_run:
    workflows: ['GLaDOS scheduled checkin']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: no mail/state write; digest: send test/daily digest; normal: scheduled behavior'
        default: digest
        type: choice
        options: [mail-test, preview, digest, normal]

permissions:
  contents: write
  actions: read

jobs:
  scheduler-health:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Inspect and reactivate this scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/actions/workflows/university-assistant.yml'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              workflow = json.load(response)
          print('School workflow scheduler state:', workflow['state'])
          if workflow['state'] != 'active' or os.environ['EVENT'] == 'push':
              request = urllib.request.Request(url + '/enable', data=b'', headers=headers, method='PUT')
              with urllib.request.urlopen(request, timeout=30) as response:
                  print('Scheduler reactivated:', response.status)
          if os.environ['EVENT'] == 'schedule':
              content_url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/contents/.github/workflows/university-assistant.yml'
              with urllib.request.urlopen(urllib.request.Request(content_url, headers=headers), timeout=30) as response:
                  file = json.load(response)
              content = base64.b64decode(file['content']).decode()
              probe = "    # Temporary native-scheduler verification; remove after first schedule event.\n    - cron: '*/5 * * * *'\n"
              if probe in content:
                  payload = {'message': 'chore: remove scheduler probe after native school trigger verified', 'sha': file['sha'], 'content': base64.b64encode(content.replace(probe, '').encode()).decode()}
                  request = urllib.request.Request(content_url, data=json.dumps(payload).encode(), headers=headers, method='PUT')
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print('Native schedule verified; temporary probe removed:', response.status)
          PY
  monitor:
    concurrency:
      group: university-assistant
      cancel-in-progress: false
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STATE_DIR: ${{ github.workspace }}/notice-state
      GITHUB_TOKEN: ${{ github.token }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test notice parsing and delivery safeguards
        run: python -m unittest discover -s automation/tests
      - name: Restore durable public-notice state
        if: github.event_name != 'push' && inputs.mode != 'preview' && inputs.mode != 'mail-test'
        run: |
          mkdir -p "$STATE_DIR"
          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch origin automation-state
            git show FETCH_HEAD:state.json > "$STATE_DIR/state.json"
          fi
      - name: Monitor and deliver
        id: run
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "push" || "$INPUT_MODE" == "preview" ]]; then
            args+=(--preview)
          elif [[ "$INPUT_MODE" == "mail-test" ]]; then
            args+=(--test-mail)
          elif [[ "$INPUT_MODE" == "digest" ]]; then
            args+=(--force-digest)
          fi
          python automation/run.py "${args[@]}"
      - name: Save durable state even on mail/source failure
        if: always() && github.event_name != 'push' && inputs.mode != 'preview' && inputs.mode != 'mail-test'
        shell: bash
        run: |
          if [[ ! -f "$STATE_DIR/state.json" ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch origin automation-state
            git worktree add -B automation-state /tmp/notice-state-tree FETCH_HEAD
          else
            mkdir -p /tmp/notice-state-tree
            git worktree add --detach /tmp/notice-state-tree HEAD
            cd /tmp/notice-state-tree
            git checkout --orphan automation-state
            git rm -rf .
          fi
          cd /tmp/notice-state-tree
          cp "$STATE_DIR/state.json" state.json
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist public-notice queue and delivery markers'
            git push origin HEAD:automation-state
          fi
      - name: Upload public preview and health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: university-notice-report
          path: automation/output/
          retention-days: 7
